name: Bug report
description: Something in Gokapi Desktop does not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do not paste API keys, tokens, private links or personal data.
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 10/11
        - Linux
        - macOS (Apple Silicon)
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation method
      options:
        - Windows installer (NSIS)
        - Linux AppImage
        - Linux .deb
        - macOS .dmg
        - Built from source
    validations:
      required: true
  - type: input
    id: gokapi
    attributes:
      label: Gokapi server version
      placeholder: "2.2.4"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Select three files
        3. Choose "One ZIP"
        4. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: actual
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove API keys, tokens, personal data and real download links.
      render: text
  - type: checkboxes
    id: confirm
    attributes:
      label: Before submitting
      options:
        - label: I removed API keys, tokens and personal data from this report.
          required: true
